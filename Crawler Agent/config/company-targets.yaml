metadata:
  title: "Scout target companies"
  curated_as_of: "2026-08-12"
  geographic_focus: "Employers with European technology opportunities"
  purpose: "Prioritize reputable employers with strong global, technical, financial, industrial, or institutional brand signals."
  disclaimer:
    - "This is an extensive seed list, not an exhaustive list of every strong employer."
    - "Inclusion does not guarantee an open role, a good workplace, or a positive hiring outcome."
    - "Scout must verify every vacancy on an official careers or applicant-tracking page."
    - "Company priority must remain separate from candidate-to-job fit scoring."

selection_basis:
  - "Global scale and recognizable employer brand"
  - "Technical reputation or engineering intensity"
  - "Selectivity and potential resume signal"
  - "Strong standing in finance, consulting, industry, research, or infrastructure"
  - "Established or meaningful European operations"
  - "Relevance to software, AI, data, cloud, cybersecurity, VR/XR, infrastructure, or other IT work"

search_behavior:
  search_target_companies_first: true
  search_beyond_target_list: true
  treat_list_as_whitelist: false
  rotate_across_groups: true
  full_target_sweep_each_run: true
  verify_on_official_source: true

priority_policy:
  highest: "Search before other target groups. Strongest global or technical resume signal."
  high: "Strong employer or sector signal. Rotate consistently."
  standard: "Large, reputable enterprise with meaningful IT functions."
  company_priority_modifies_candidate_fit_score: false
  company_priority_may_break_close_score_ties: true

